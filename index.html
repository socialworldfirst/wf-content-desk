<!doctype html>
<html lang="en">
<head><!--gh-guard v1 images=yes-->
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content Desk</title>
<meta name="description" content="How WorldFirst marketing turns content as a service into a chat-based, AI-led desk the whole team can use.">
<link rel="stylesheet" href="wf/fonts/fonts.css">
<style>
:root{
  --red:#FF0051; --red-hover:#EB004B; --dark-purple:#13002D; --purple:#32006E; --grey:#484F56; --black:#1F2323; --light-grey:#ECEDEE; --white:#FFFFFF;
  --n150:#F2F2F2; --n400:#DADCDD; --n800:#74797D; --pink050:#FFF0F5;
  --font:"Poppins",system-ui,sans-serif;
  --maxw:1184px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--black);background:var(--white);font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--red);text-decoration:none}
a:hover{color:var(--red-hover)}
img{max-width:100%;display:block}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
section{padding:96px 0}
h1,h2,h3,h4{margin:0;font-weight:800;line-height:1.2}
h1{font-size:60px;letter-spacing:-1px;line-height:1.0}
h2{font-size:44px;letter-spacing:-3px;word-spacing:5px}
h3{font-size:32px;letter-spacing:0}
h4{font-size:24px;font-weight:600}
p{margin:0}
.eyebrow{display:inline-block;font-weight:500;font-size:16px;line-height:1;padding:12px 18px;border-radius:40px;background:var(--red);color:var(--white);margin-bottom:24px}
.lede{font-size:24px;line-height:1.4;color:var(--grey);max-width:820px}
.muted{color:var(--grey)}
.sub{margin-top:24px;max-width:820px}
.grid{display:grid;gap:24px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--white);border:1px solid var(--light-grey);border-radius:24px;padding:40px}
.card h4{margin-bottom:12px}
.card .ic{width:40px;height:40px;margin-bottom:24px}
.light{background:linear-gradient(135deg,#FFFFFF 0%,30%,#ECEDEE 100%)}
.pinkbg{background:var(--pink050)}
.num{font-weight:800;font-size:20px;color:var(--red);margin-bottom:8px}

/* nav */
nav{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--light-grey)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:72px}
nav img{height:28px}
nav ul{list-style:none;margin:0;padding:0;display:flex;gap:32px;font-size:16px;font-weight:500}
nav a{color:var(--black)}
nav a:hover{color:var(--red)}

/* hero */
.hero{position:relative;overflow:hidden;color:var(--white);background:linear-gradient(135deg,#32006E 0%,70%,#13002D 100%);padding:120px 0 140px}
.hero .map{position:absolute;inset:0;background:url("wf/map.png") center/cover no-repeat;opacity:.18;pointer-events:none}
.hero .wrap{position:relative}
.hero .eyebrow{background:var(--white);color:var(--black)}
.hero h1{max-width:900px;margin-bottom:24px}
.hero .lede{color:rgba(255,255,255,.85)}
.hero .belt{position:absolute;right:-10%;bottom:-40px;width:70%;height:120px;border-radius:150px;background:linear-gradient(90deg,#FF0051 0%,#FF882A 100%);transform:rotate(-6deg);opacity:.95}
.hero .tags{display:flex;gap:12px;flex-wrap:wrap;margin-top:40px}
.hero .tags span{font-size:16px;font-weight:500;padding:10px 16px;border-radius:40px;border:1px solid rgba(255,255,255,.4)}

/* flow */
.flow{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-top:56px}
.step{background:var(--white);border:1px solid var(--light-grey);border-radius:12px;padding:24px 20px;position:relative}
.step .k{font-size:14px;font-weight:500;color:var(--red);margin-bottom:8px}
.step h4{font-size:20px;font-weight:800;margin-bottom:8px}
.step p{font-size:14px;color:var(--grey)}
.step.human{background:var(--pink050);border-color:#FAD8D5}
.legend{display:flex;gap:24px;margin-top:24px;font-size:14px;color:var(--grey)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:8px;border:1px solid var(--light-grey)}
.legend i.h{background:var(--pink050);border-color:#FAD8D5}
.legend i.m{background:var(--white)}

/* chat mock */
.chat{background:var(--white);border:1px solid var(--light-grey);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;height:100%}
.chat .bar{padding:16px 24px;border-bottom:1px solid var(--light-grey);font-size:14px;font-weight:500;color:var(--grey);display:flex;justify-content:space-between}
.chat .bar b{color:var(--black)}
.chat .body{padding:24px;display:flex;flex-direction:column;gap:12px;flex:1}
.msg{max-width:88%;padding:12px 16px;border-radius:16px;font-size:15px;line-height:1.45}
.msg.u{align-self:flex-end;background:var(--red);color:var(--white);border-bottom-right-radius:4px}
.msg.b{align-self:flex-start;background:var(--n150);color:var(--black);border-bottom-left-radius:4px}
.msg.b .src{display:block;margin-top:6px;font-size:13px;color:var(--grey)}
.msg .who{display:block;font-size:12px;font-weight:600;opacity:.7;margin-bottom:4px}
.verdict{display:inline-block;font-weight:800;font-size:13px;padding:4px 10px;border-radius:40px;margin-right:6px}
.verdict.pass{background:#D7C7F8;color:#32006E}
.verdict.fix{background:#FFE41E;color:#1F2323}
.verdict.block{background:#FCE4EC;color:#FF0051}
.chip{display:inline-block;color:var(--black);font-size:13px;font-weight:500;padding:6px 10px;border-radius:8px;background:var(--white);border:1px solid var(--n400);margin:6px 6px 0 0}
.verbhead{display:flex;align-items:baseline;gap:16px;margin-bottom:16px;min-height:72px}
.verbhead h3{color:var(--red)}
.verbhead span{font-size:16px;color:var(--grey)}

/* rules */
.rule{display:grid;grid-template-columns:72px 1fr;gap:24px;padding:32px 0;border-top:1px solid var(--light-grey)}
.rule:last-child{border-bottom:1px solid var(--light-grey)}
.rule .n{font-weight:800;font-size:44px;letter-spacing:-3px;color:var(--red);line-height:1}
.rule h4{margin-bottom:8px}

/* boundary */
.boundary{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.boundary .card{border-radius:24px}
.boundary ul{margin:16px 0 0;padding-left:20px;color:var(--grey)}
.boundary li{margin-bottom:6px}
.no{border-color:#FAD8D5;background:var(--pink050)}

/* stack */
.stack{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:16px;align-items:stretch;margin-top:56px}
.stack .arrow{display:flex;align-items:center;color:var(--red);font-weight:800;font-size:28px}
.stack .card p{color:var(--grey);font-size:16px}
.stack .card small{display:block;margin-top:16px;font-size:14px;color:var(--n800)}

/* roles */
.roles .card{background:transparent;border:0;padding:0}
.roles h4{color:var(--red)}

/* build */
.build{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:56px}
.build .card{position:relative}
.build .wk{font-size:14px;font-weight:500;color:var(--grey);margin-bottom:8px}
.build .card.now{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.measure{margin-top:56px;background:var(--white);border:1px solid var(--light-grey);border-radius:24px;padding:40px}
.measure table{width:100%;border-collapse:collapse;font-size:16px;margin-top:16px}
.measure th,.measure td{text-align:left;padding:14px 0;border-bottom:1px solid var(--light-grey);vertical-align:top}
.measure th{font-weight:600;color:var(--grey);font-size:14px}

/* closing */
.closing{background:linear-gradient(135deg,#FF0051 0%,70%,#13002D 100%);color:var(--white);position:relative;overflow:hidden}
.closing .map{position:absolute;inset:0;background:url("wf/map.png") center/cover no-repeat;opacity:.14;pointer-events:none}
.closing .wrap{position:relative}
.closing h2{max-width:900px;margin-bottom:24px}
.closing p{max-width:760px;color:rgba(255,255,255,.88)}
.closing .quote{margin-top:40px;font-size:16px;color:rgba(255,255,255,.7)}

footer{padding:40px 0;font-size:14px;color:var(--grey)}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
footer img{height:24px}

@media (max-width:1024px){
  .g3,.g4{grid-template-columns:repeat(2,1fr)}
  .flow{grid-template-columns:repeat(4,1fr)}
  .stack{grid-template-columns:1fr}
  .stack .arrow{justify-content:center;transform:rotate(90deg)}
  .build{grid-template-columns:1fr}
}
@media (max-width:768px){
  section{padding:56px 0}
  h1{font-size:40px}
  h2{font-size:32px;letter-spacing:-1px}
  h3{font-size:24px}
  .lede{font-size:20px}
  .g2,.g3,.g4,.boundary{grid-template-columns:1fr}
  .flow{grid-template-columns:repeat(2,1fr)}
  .card{padding:24px}
  nav ul{display:none}
  .hero{padding:72px 0 100px}
  .rule{grid-template-columns:1fr;gap:8px}
}
</style>

<style>
:root{--gate-ink:#111;--gate-mute:#8a8a8a;--gate-line:#e5e5e5;--gate-bg:#fff}
@media (prefers-color-scheme:dark){:root{--gate-ink:#f2f2f2;--gate-mute:#8a8a8a;--gate-line:#2a2a2a;--gate-bg:#0e0e0e}}
#gate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;
justify-content:center;background:var(--gate-bg);
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
#gate-card{width:min(320px,86vw);text-align:left}
#gate-card h2{font-size:15px;font-weight:600;letter-spacing:-.01em;
color:var(--gate-ink);margin:0 0 4px}
#gate-card p{font-size:12px;color:var(--gate-mute);margin:0 0 20px;line-height:1.5}
#gate-form{display:flex;gap:8px}
#gate-input{flex:1;padding:9px 11px;font-size:13px;color:var(--gate-ink);
background:transparent;border:1px solid var(--gate-line);border-radius:6px;outline:none}
#gate-input:focus{border-color:var(--gate-ink)}
#gate-btn{padding:9px 15px;font-size:13px;border:1px solid var(--gate-ink);
border-radius:6px;background:var(--gate-ink);color:var(--gate-bg);cursor:pointer}
#gate-err{min-height:16px;margin-top:9px;font-size:12px;color:#c0392b}
#gate-foot{margin-top:22px;font-size:11px;color:var(--gate-mute)}
.gate-lock{position:fixed;right:12px;bottom:10px;z-index:9998;font:11px
-apple-system,BlinkMacSystemFont,sans-serif;color:#9a9a9a;cursor:pointer;
opacity:.55;text-decoration:underline}
.gate-lock:hover{opacity:1}
</style>
</head>

<script>
(function(){
  var KEY='gate:'+location.pathname;
  function b2b(b64){var s=atob(b64),a=new Uint8Array(s.length);
    for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
  async function derive(pw,salt,it){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),
      'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:it,
      hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  }
  async function decrypt(pw){
    var b=JSON.parse(document.getElementById('gate-payload').textContent);
    var k=await derive(pw,b2b(b.salt),b.iterations);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2b(b.iv)},k,
      b2b(b.ciphertext));
    return new TextDecoder().decode(plain);
  }
  function runScripts(root){
    root.querySelectorAll('script').forEach(function(old){
      var s=document.createElement('script');
      for(var i=0;i<old.attributes.length;i++){
        s.setAttribute(old.attributes[i].name,old.attributes[i].value);
      }
      s.textContent=old.textContent;
      old.parentNode.replaceChild(s,old);
    });
  }
  function reveal(html){
    var c=document.getElementById('gate-content');
    c.innerHTML=html; c.hidden=false;
    var g=document.getElementById('gate'); if(g) g.remove();
    document.body.classList.remove('gate-locked');
    runScripts(c);
    var lock=document.createElement('div');
    lock.className='gate-lock'; lock.textContent='lock device';
    lock.onclick=function(){localStorage.removeItem(KEY);location.reload();};
    document.body.appendChild(lock);
    window.dispatchEvent(new Event('gate:unlocked'));
    try{window.dispatchEvent(new Event('resize'));}catch(e){}
  }
  window.gateSubmit=async function(e){
    e.preventDefault();
    var inp=document.getElementById('gate-input');
    var err=document.getElementById('gate-err');
    err.textContent='';
    try{
      var html=await decrypt(inp.value);
      localStorage.setItem(KEY,inp.value);
      reveal(html);
    }catch(_){ err.textContent='Wrong password.'; inp.select(); }
    return false;
  };
  document.addEventListener('DOMContentLoaded',async function(){
    var saved=localStorage.getItem(KEY);
    if(!saved) return;
    try{ reveal(await decrypt(saved)); }
    catch(_){ localStorage.removeItem(KEY); }
  });
})();
</script>
</body>
</html>
